<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원가입</title>
<link rel="stylesheet" href="../css/ktjoin.css">
<script src="../js/ktjoin.js" defer></script>
</head>
<body>

<div class="card">
  <h2>회원가입</h2>
  <form id="joinForm">

    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="id" name="id" placeholder="아이디 입력">
    </div>

    <div class="form-group">
      <label>비밀번호</label>
      <input type="text" id="pw1" name="pw1" placeholder="비밀번호 입력">
    </div>

    <div class="form-group">
      <label>비밀번호확인</label>
      <input type="text" id="pw2" name="pw2" placeholder="비밀번호 확인">
    </div>

    <button type="submit" id="submitBtn">등록</button>
    <button type="button" id="cancelBtn">취소</button>
  </form>
</div>
</html>
