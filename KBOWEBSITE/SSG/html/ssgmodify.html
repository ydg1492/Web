<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카드형게시물수정</title>
<link rel="stylesheet" href="../css/ssgmodify.css">
<script src="../js/ssgmodify.js" defer></script>
</head>
<body>

<div class="card">
  <h2>게시글 수정</h2>

  <form id="modifyForm">
    <input type="hidden" id="no" name="no" value="">
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="title" name="title">
    </div>

    <div class="form-group">
      <label>내용</label>
      <textarea id="msg" name="msg"></textarea>
    </div>

    <button type="submit" id="submitbtn">수정</button>
    <button type="button" id="cancelBtn">취소</button>

  </form>
</div>

</body>
</html>
