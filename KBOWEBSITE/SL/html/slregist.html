<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카드형게시물등록</title>
<link rel="stylesheet" href="../css/slregist.css">
<script src="../js/slregist.js" defer></script>
</head>
<body>

<div class="card">
  <h2>게시글 등록</h2>
  <form id="registForm">

    <div class="form-group">
      <label>제목</label>
      <input type="text" id="title" name="title" placeholder="제목 입력">
    </div>

    <div class="form-group">
      <label>내용</label>
      <textarea id="msg" name="message" placeholder="내용 입력"></textarea>
    </div>

    <button type="submit" id="submitBtn">등록</button>
    <button type="button" id="cancelBtn">취소</button>
  </form>
</div>
</html>
