<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<link rel="stylesheet" href="../css/ltlogin.css">
<script src="../js/login.js" defer></script>
</head>
<body>

<div class="card">
  <h2>로그인</h2>
  <form id="loginForm">

    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="id" name="id" placeholder="아이디입력">
    </div>

    <div class="form-group">
      <label>비밀번호</label>
      <input type="text" id="pw" name="pw" placeholder="비밀번호 입력">
    </div>

    <button type="submit" id="submitBtn">등록</button>
    <button type="button" id="cancelBtn">취소</button>
  </form>
</div>
</html>
